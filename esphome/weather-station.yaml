esphome:
  name: weather-station
  friendly_name: Wetterstation

esp8266:
  board: d1_mini

# Custom component, see components/tfa_sky/ - split into sensor (CC1101 raw
# capture), decoding (TFA protocol) and esphome (this platform + HA
# publishing) layers.
external_components:
  - source:
      type: local
      path: components

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

# No static ssid/password: the device boots straight into its own AP below
# with a captive portal, so real WLAN credentials are only needed once, after
# flashing (submitted via the portal and then stored on the device flash -
# see README "ESPHome / Home Assistant" for the exact steps).
wifi:
  # ESP8266 modem sleep causes dropped API connections on some APs; the device
  # is mains powered anyway. TX power stays at the 20dB default on purpose:
  # the WiFi link is weak (~-73dBm) - buffer the CC1101 supply with a cap
  # instead of lowering TX power to tame current spikes.
  power_save_mode: none
  ap:
    ssid: "Weather Station Fallback"
    password: !secret wifi_ap_password

captive_portal:

# Wall-clock time from Home Assistant (synced over the native API, no NTP
# server needed). Only used to stamp "Letzter Empfang" below - the ESP itself
# has no RTC, so until the first sync after boot the time is invalid.
time:
  - platform: homeassistant
    id: ha_time

# Diagnostics to tell the failure modes apart after the fact: uptime resets
# + reset reason show crashes/watchdog resets, loop time shows a blocked
# main loop, free heap shows leaks, reinit counter shows CC1101 trouble.
debug:
  update_interval: 60s

text_sensor:
  - platform: debug
    reset_reason:
      name: "Reset-Grund"

  # Time of the last valid frame from the outdoor sensor, shown in HA as
  # "vor 30 Sekunden" etc. Needed because HA's own last-updated/last-changed
  # only move when the *value* changes - with a steady 2.1 C they would show
  # "1 hour ago" although a frame arrives every ~64s. Set from the
  # temperature sensor's on_value below. device_class timestamp expects an
  # ISO 8601 string with UTC offset (e.g. 2026-11-24T22:57:00+0100).
  - platform: template
    id: last_frame
    name: "Letzter Empfang"
    device_class: timestamp

sensor:
  - platform: tfa_sky
    # Pins/frequency/threshold below match the defaults documented in
    # README.md - listed explicitly here for visibility, remove any that
    # you don't need to override.
    sck_pin: 14
    miso_pin: 12
    mosi_pin: 13
    csn_pin: 15
    gdo0_pin: 5
    frequency: 433.92
    rssi_threshold: -70
    timeout: 15min
    temperature:
      name: "Außentemperatur"
      # on_value fires on every publish, even if the value is unchanged, so
      # this runs once per accepted frame. Skipped when:
      # - x is NaN: that's the `timeout` above marking the values unknown,
      #   not a reception - the timestamp should keep showing when the last
      #   real frame arrived.
      # - the clock isn't synced yet (shortly after boot): the timestamp
      #   would be 1970. The next frame after the sync sets it.
      on_value:
        - if:
            condition:
              lambda: 'return !std::isnan(x) && id(ha_time).now().is_valid();'
            then:
              - text_sensor.template.publish:
                  id: last_frame
                  state: !lambda 'return id(ha_time).now().strftime("%Y-%m-%dT%H:%M:%S%z");'
    humidity:
      name: "Außenluftfeuchtigkeit"
    signal_strength:
      name: "Empfangssignal Wetterstation"
    reinit_count:
      name: "CC1101 Neu-Initialisierungen"

  - platform: wifi_signal
    name: "WLAN-Signal"
    entity_category: diagnostic
    update_interval: 60s

  - platform: uptime
    name: "Uptime"

  - platform: debug
    free:
      name: "Heap frei"
    loop_time:
      name: "Loop-Zeit"
