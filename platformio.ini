; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    https://github.com/LSatan/SmartRC-CC1101-Driver-Lib.git

; --- diagnostic / tool sketches, see tools/ ---
; usage: pio run -e <name> -t upload

[env:self_check]
extends = env:d1_mini
build_src_filter = +<../tools/self_check/main.cpp> -<main.cpp>

[env:rssi_scan]
extends = env:d1_mini
build_src_filter = +<../tools/rssi_scan/main.cpp> -<main.cpp>

[env:raw_capture]
extends = env:d1_mini
build_src_filter = +<../tools/raw_capture/main.cpp> -<main.cpp>
